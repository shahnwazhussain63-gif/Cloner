name: Compose APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find and Unzip Code
      run: |
        ls -la
        unzip -o \*.zip || echo "No zip found at root"
        ls -la

    - name: Grant execute permission for gradlew
      run: |
        find . -name "gradlew" -exec chmod +x {} \;
      continue-on-error: true

    - name: Build Jetpack Compose APK
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "ERROR: gradlew file not found anywhere in the repository!"
          exit 1
        fi
        cd $(dirname "$GRADLEW_PATH")
        ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Jetpack-Compose-APK
        path: "**/build/outputs/apk/debug/*.apk"
